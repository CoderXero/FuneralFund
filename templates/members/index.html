{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Members</h1>
<div class="table-responsive bg-white border rounded">
  <table class="table table-hover mb-0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for member in members %}
      <tr>
        <td>{{ member.name }}</td>
        <td>{{ member.email }}</td>
        <td>{{ member.role }}</td>
        <td>{{ member.status }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-secondary">No members yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
